name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard manifest activity name
        # Regression guard for the v1.0.1 launch crash: the activity must be
        # the fully qualified dev.one.launcher.MainActivity. A leading-dot
        # ".MainActivity" resolves against the com.garrietta.one namespace,
        # a class that is not in the dex, and the app dies on launch.
        run: grep -q 'android:name="dev.one.launcher.MainActivity"' app/src/main/AndroidManifest.xml
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run unit tests and build debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: one-debug-apk
          path: app/build/outputs/apk/debug/*.apk
