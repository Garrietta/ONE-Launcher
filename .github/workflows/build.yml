name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard manifest activity name
        # Regression guard for the v1.0.1 launch crash: the activity must be
        # the fully qualified dev.one.launcher.MainActivity. A leading-dot
        # ".MainActivity" resolves against the com.garrietta.one namespace,
        # a class that is not in the dex, and the app dies on launch.
        run: grep -q 'android:name="dev.one.launcher.MainActivity"' app/src/main/AndroidManifest.xml
      - name: Guard ViewModel init order
        # Regression guard for the v1.0.2 launch crash: OneViewModel's init
        # block calls refreshLibrary(), which writes _portStatuses. Kotlin
        # initializes properties and init blocks in declaration order, so
        # every MutableStateFlow must be declared BEFORE the init block —
        # otherwise its backing field is still null and the app dies with
        # an NPE on launch. The project has no Robolectric, so a unit test
        # cannot construct this AndroidViewModel; the line-order check
        # below tests the exact seam instead.
        run: |
          python3 - <<'PY'
          import re, sys
          path = "app/src/main/java/dev/one/launcher/ui/OneViewModel.kt"
          lines = open(path).read().splitlines()
          init_line = next(i + 1 for i, l in enumerate(lines) if re.search(r'^\s*init\s*\{', l))
          bad = [(i + 1, l.strip()) for i, l in enumerate(lines)
                 if re.search(r'private val _\w+\s*=\s*MutableStateFlow', l) and i + 1 > init_line]
          if bad:
              print(f"FAIL: MutableStateFlow declared after init (line {init_line}):")
              for n, l in bad:
                  print(f"  line {n}: {l}")
              sys.exit(1)
          print(f"OK: all MutableStateFlow declarations precede init (line {init_line})")
          PY
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/one-release-keystore.jks"
      - name: Run unit tests and build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/one-release-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease --stacktrace
      - name: Verify release APK signature
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs "$APK"
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: one-release-apk
          path: app/build/outputs/apk/release/*.apk
